name: publish apt
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Collect .deb files from each app's releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          for repo in gypsynature/srtdebug; do   # add more owner/repo names here
            for t in $(gh release list -R "$repo" --limit 100 --json tagName -q '.[].tagName'); do
              gh release download "$t" -R "$repo" --pattern '*.deb' --dir incoming --skip-existing || true
            done
          done

      - name: Build the apt folder
        run: |
          mkdir -p site/pool/main site/dists/stable/main/binary-all site/dists/stable/main/binary-amd64 site/dists/stable/main/binary-arm64
          cp incoming/*.deb site/pool/main/ 2>/dev/null || true
          cd site
          dpkg-scanpackages --multiversion pool > dists/stable/main/binary-all/Packages
          gzip -k -9 -f dists/stable/main/binary-all/Packages
          for a in amd64 arm64; do cp dists/stable/main/binary-all/Packages* dists/stable/main/binary-$a/; done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=apt \
            -o APT::FTPArchive::Release::Label=apt \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64 all" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          touch .nojekyll

      - name: Sign the index
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --export "$KEYID" > site/apt-archive-keyring.gpg
          cd site/dists/stable
          gpg --batch --yes -u "$KEYID" -abs -o Release.gpg Release
          gpg --batch --yes -u "$KEYID" --clearsign -o InRelease Release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
