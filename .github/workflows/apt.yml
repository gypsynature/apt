name: publish apt
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Collect .deb files from each app's releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          for repo in gypsynature/srtdebug; do   # add more owner/repo names here
            for t in $(gh release list -R "$repo" --limit 100 --json tagName -q '.[].tagName'); do
              gh release download "$t" -R "$repo" --pattern '*.deb' --dir incoming --skip-existing || true
            done
          done

      - name: Build the apt folder
        run: |
          mkdir -p site/pool/main site/dists/stable/main/binary-all site/dists/stable/main/binary-amd64 site/dists/stable/main/binary-arm64 site/dists/stable/main/binary-i386
          cp incoming/*.deb site/pool/main/ 2>/dev/null || true
          cd site
          dpkg-scanpackages --multiversion pool > dists/stable/main/binary-all/Packages
          gzip -k -9 -f dists/stable/main/binary-all/Packages
          for a in amd64 arm64 i386; do cp dists/stable/main/binary-all/Packages* dists/stable/main/binary-$a/; done
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=apt \
            -o APT::FTPArchive::Release::Label=apt \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64 i386 all" \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          touch .nojekyll

      - name: Sign the index
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --export "$KEYID" > site/apt-archive-keyring.gpg
          cd site/dists/stable
          gpg --batch --yes -u "$KEYID" -abs -o Release.gpg Release
          gpg --batch --yes -u "$KEYID" --clearsign -o InRelease Release

      - name: Write the package list page
        run: |
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>apt packages</title><body style="font-family:system-ui;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.5"><h1>Ubuntu packages</h1><h2>Add this repository (once)</h2><pre style="background:#f4f4f4;padding:12px;overflow-x:auto">'
            echo 'curl -fsSL https://gypsynature.github.io/apt/apt-archive-keyring.gpg | sudo tee /usr/share/keyrings/apt-archive-keyring.gpg &gt;/dev/null'
            echo 'echo "deb [signed-by=/usr/share/keyrings/apt-archive-keyring.gpg] https://gypsynature.github.io/apt stable main" | sudo tee /etc/apt/sources.list.d/gypsynature.list'
            echo 'sudo apt update &amp;&amp; sudo apt install srtdebug</pre>'
            echo '<p>After that, <code>sudo apt update &amp;&amp; sudo apt upgrade</code> keeps every package here current.</p><h2>Available packages</h2><ul>'
            awk 'BEGIN{RS="";FS="\n"} {p="";v="";d=""; for(i=1;i<=NF;i++){ if($i~/^Package: /)p=substr($i,10); if($i~/^Version: /)v=substr($i,10); if($i~/^Description: /)d=substr($i,14)}; print "<li><b>" p "</b> " v " - " d "</li>"}' site/dists/stable/main/binary-all/Packages
            echo '</ul></body>'
          } > site/index.html
          
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
